<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
   <title>Clima-Control</title>
   <style>
      body {
         font-family: Arial, sans-serif;
         margin: 20px;
      }
      table {
         border-collapse: collapse;
         width: 100%;
      }
      th, td {
         border: 1px solid #ccc;
         padding: 8px;
         text-align: center;
      }
      th {
         background-color: #f0f0f0;
      }
      .tabs {
         display: flex;
         gap: 10px;
         margin-bottom: 20px;
      }
      .tab {
         padding: 8px 16px;
         cursor: pointer;
      }
      .tab.active {
         font-weight: bold;
         border-bottom: 2px solid #007bff;
      }
      .tab-panel {
         display: none;
      }
      .tab-panel.active {
         display: block;
      }
      .slider-row {
         display: flex;
         align-items: center;
         margin-bottom: 12px;
      }
      .slider-row label {
         width: 150px;
      }
      .slider-row input[type="range"] {
         flex: 0 1 150px;
      }
      .slider-row span {
         width: 50px;
         text-align: right;
         margin-left: 10px;
      }
      .config-input {
         width: 100%;
         max-width: 220px;
         box-sizing: border-box;
      }
      .save-btn {
         min-width: 80px;
      }
   </style>
</head>
<body>
<h1>Clima-Control Monitor</h1>
<div class="tabs">
  <button class="tab active" data-tab="monitor">Monitor</button>
  <button class="tab" data-tab="setup">Ausgänge konfigurieren</button>
</div>

<section id="tab-monitor" class="tab-panel active">
   <h2>Sensordaten</h2>
   <table id="sensorTable">
       <thead>
          <tr>
             <th>Sensor ID</th>
             <th>Bus</th>
             <th>Typ</th>
             <th>Temperatur (°C)</th>
             <th>Luftdruck (hPa)</th>
             <th>Feuchtigkeit (%)</th>
             <th>CO₂ (ppm)</th>
          </tr>
       </thead>
       <tbody>
       </tbody>
   </table>
   <br>
   <div>Letzte Aktualisierung: <span id="timestamp">--:--:--</span></div>
   <hr>
   <h2>Ausgänge</h2>
   <label for="modeSwitch">Betriebsart:</label>
   <select id="modeSwitch" onchange="setMode()">
       <option value="off">Aus</option>
       <option value="manual">Manuell</option>
       <option value="auto">Automatik</option>
   </select>
   <br><br>
   <div id="sliders-container"></div>
</section>

<section id="tab-setup" class="tab-panel">
   <h2>Ausgangs-Konfiguration</h2>
   <table id="outputConfigTable">
      <thead>
         <tr>
            <th>Ausgang</th>
            <th>Name</th>
            <th>Typ</th>
            <th>Standardwert</th>
            <th>Speichern</th>
         </tr>
      </thead>
      <tbody></tbody>
   </table>
</section>

<script>
let SensorCount = -1;
let OutputChannels = 8;
let CurrentMode = "auto";

function setTab(tabId) {
 document.querySelectorAll('.tab').forEach(tab => {
   tab.classList.toggle('active', tab.dataset.tab === tabId);
 });
 document.querySelectorAll('.tab-panel').forEach(panel => {
   panel.classList.toggle('active', panel.id === 'tab-' + tabId);
 });
}

document.querySelectorAll('.tab').forEach(tab => {
 tab.addEventListener('click', () => setTab(tab.dataset.tab));
});

function createSliders(count) {
  const container = document.getElementById("sliders-container");

  for (let i = 0; i < count; i++) {
    const row = document.createElement("div");
    row.className = "slider-row";

    const label = document.createElement("label");
    label.textContent = "Ausgang " + (i + 1);

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = "100";
    slider.value = "50";
    slider.id = "slider" + i;
    slider.disabled = true;
    slider.oninput = () => { setOutput(i, slider.value); }

    const valueDisplay = document.createElement("span");
    valueDisplay.id = "value" + i;
    valueDisplay.textContent = "50 %";

    row.appendChild(label);
    row.appendChild(slider);
    row.appendChild(valueDisplay);
    container.appendChild(row);
  }
}

function createOutputConfigRows() {
  const tbody = document.querySelector("#outputConfigTable tbody");
  tbody.innerHTML = "";

  for (let i = 0; i < OutputChannels; i++) {
    const row = document.createElement("tr");

    const channelCell = document.createElement("td");
    channelCell.textContent = "OUT " + (i + 1);

    const nameCell = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.maxLength = 24;
    nameInput.className = "config-input";
    nameInput.id = "configName" + i;
    nameCell.appendChild(nameInput);

    const typeCell = document.createElement("td");
    const typeSelect = document.createElement("select");
    typeSelect.id = "configType" + i;
    typeSelect.className = "config-input";
    [
      { value: 1, text: 'DIGITAL' },
      { value: 2, text: 'PWM' },
      { value: 3, text: 'PWM_AC' }
    ].forEach(optionDef => {
      const option = document.createElement("option");
      option.value = String(optionDef.value);
      option.textContent = optionDef.text;
      typeSelect.appendChild(option);
    });
    typeCell.appendChild(typeSelect);

    const valueCell = document.createElement("td");
    const valueInput = document.createElement("input");
    valueInput.type = "number";
    valueInput.min = "0";
    valueInput.max = "1000";
    valueInput.step = "1";
    valueInput.className = "config-input";
    valueInput.id = "configValue" + i;
    valueCell.appendChild(valueInput);

    const actionCell = document.createElement("td");
    const saveButton = document.createElement("button");
    saveButton.type = "button";
    saveButton.textContent = "Save";
    saveButton.className = "save-btn";
    saveButton.onclick = () => saveOutputConfig(i, nameInput.value, typeSelect.value, valueInput.value);
    actionCell.appendChild(saveButton);

    row.appendChild(channelCell);
    row.appendChild(nameCell);
    row.appendChild(typeCell);
    row.appendChild(valueCell);
    row.appendChild(actionCell);
    tbody.appendChild(row);
  }
}
 
async function fetchSensorData() {
  try {
    const response = await fetch('/api/sensors');
    const data = await response.json();
    updateSensorData(data);
  } catch(error) {
    console.error('Fehler beim Laden der Sensor-Daten:', error);
  }
}
function updateSensorData(data) {
   const tableBody = document.querySelector("#sensorTable tbody");
   tableBody.innerHTML = ""; // alte Daten löschen
   data.sensors.forEach(sensor => {
      const row = document.createElement("tr");
      row.innerHTML = `
         <td>${sensor.name}</td>
         <td>${sensor.bus}</td>
         <td>${sensor.type}</td>
         <td>${format(sensor.temp, 1)}</td>
         <td>${format(sensor.pres, 1)}</td>
         <td>${format(sensor.humi, 1)}</td>
         <td>${format(sensor.co2, 0)}</td>
      `;
      tableBody.appendChild(row);
   });
  document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();
}
function format(value, format) {
    return value != null ? value.toFixed(format) : "-";
}
function fetchOutputData() {
  fetch('/api/output')
    .then(response => response.json())
    .then(data => updateOutput(data))
    .catch(error => console.error('Fehler beim Laden der Output-Daten:', error));
}
function updateOutput(data) {
  CurrentMode = data.mode;
  document.getElementById('modeSwitch').value = CurrentMode;
  for (let i = 0; i < OutputChannels; i++) {
    const slider = document.getElementById("slider" + i);
    let pwm = data.channels[i];
    slider.value = pwm;
    document.getElementById("value" + i).textContent = pwm + " %";
    slider.disabled = (CurrentMode !== "manual");
  }
}

async function fetchOutputConfigData() {
  try {
    const response = await fetch('/api/output_setup');
    const data = await response.json();
    updateOutputConfig(data);
  } catch (error) {
    console.error('Fehler beim Laden der Ausgangs-Konfiguration:', error);
  }
}

function updateOutputConfig(data) {
  const configChannels = data.channels || [];
  const rows = document.querySelectorAll('#outputConfigTable tbody tr');
  for (let i = 0; i < OutputChannels; i++) {
    const row = rows[i];
    if (!row) continue;
    const nameInput = row.querySelector('input[type="text"]');
    const typeSelect = row.querySelector('select');
    const valueInput = row.querySelector('input[type="number"]');
    const channel = configChannels.find(item => item.channel === i) || { name: 'OUT' + (i + 1), type: 1, value: 0 };
    nameInput.value = channel.name || ('OUT' + (i + 1));
    typeSelect.value = String(channel.type || 1);
    valueInput.value = String(channel.value || 0);
  }
}

async function saveOutputConfig(channel, name, type, value) {
  const trimmedName = (name || '').trim();
  const parsedType = Number(type);
  const parsedValue = Number(value);

  if (trimmedName.length === 0 || trimmedName.length > 24) {
    alert('Der Name muss 1 bis 24 Zeichen lang sein.');
    return;
  }
  if (!Number.isInteger(parsedType) || parsedType < 1 || parsedType > 3) {
    alert('Bitte einen gültigen Ausgangstyp wählen.');
    return;
  }
  if (!Number.isInteger(parsedValue) || parsedValue < 0 || parsedValue > 1000) {
    alert('Der Standardwert muss ein Integerwert zwischen 0 und 1000 sein.');
    return;
  }

  const response = await fetch('/set_output_setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      channel: Number(channel),
      name: trimmedName,
      type: parsedType,
      value: parsedValue
    })
  });

  if (!response.ok) {
    alert('Speichern fehlgeschlagen.');
    return;
  }

  fetchOutputConfigData();
  fetchOutputData();
}
 
function setOutput(outchn, val) {
  document.getElementById("value" + outchn).textContent = val + " %";
  const slider = document.getElementById("slider" + outchn);
  slider.value = val;
  slider.disabled = (CurrentMode !== "manual");
  fetch("/set_output", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channel: outchn, value: parseInt(val) })
  });
}

function setMode() {
  CurrentMode = document.getElementById("modeSwitch").value;
  for (let i = 0; i < OutputChannels; i++) {
    let value = document.getElementById("slider" + i).value;
    if (CurrentMode === "off") { value = 0; }
    setOutput(i, value);
  }
  fetch("/set_mode", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: CurrentMode })
  });
}

function fetchData() {
  fetchSensorData();
  fetchOutputData();
}

createSliders(OutputChannels);
createOutputConfigRows();
setInterval(fetchData, 2000);
fetchData();
fetchOutputConfigData();
</script>
</body>
</html>
